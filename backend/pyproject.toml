[project]
name = "carwash-backend"
version = "0.1.0"
description = "carwash.app — API multi-tenant (Fase 2: infraestructura, cero dominio de lavadero)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # <0.137: desde 0.137 `include_router` deja de aplanar las rutas en `app.routes`
    # (quedan `_IncludedRouter`), y los barridos de rutas de los tests de ADR-0006,
    # ADR-0013 y L2 dejarían de ver los endpoints. Subir exige migrarlos a
    # `fastapi.routing.iter_route_contexts`.
    "fastapi>=0.136,<0.137",
    "starlette>=1.6,<2",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<3",
    "aiosqlite>=0.20,<0.21",
    "redis>=5.2,<6",
    "python-jose[cryptography]>=3.3,<4",
    # Solo en macOS x86_64: desde 45.x `cryptography` no publica wheel para esa
    # plataforma y uv intenta compilarla con cargo (falla en la máquina de desarrollo).
    # En Linux/Docker (CI, Railway) no hay restricción.
    "cryptography>=44,<45; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "passlib[bcrypt]>=1.7.4,<2",
    "bcrypt>=4.0,<4.1",
    "structlog>=24.4,<25",
    "sentry-sdk[fastapi]>=2.19,<3",
    "slowapi>=0.1.9,<0.2",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "pytest-xdist>=3.6,<4",
    "httpx>=0.27,<0.28",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.9",
    "types-passlib>=1.7,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) — accepted in places
    "B008",    # Do not perform function call in argument defaults — FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["ANN", "S101", "N806"]
"app/persistence/migrations/**" = ["ANN", "N999"]

# ADR-0007: el formateador existe desde el commit 1. Se adopta el default de
# `ruff format` — el punto es que haya UN formato, no cuál.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "slowapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.tests.*"]
# Tests exentos de tipado estricto: las firmas usan fixtures sin tipar.
# (union-attr/arg-type/operator NO se relajan: siguen cazando bugs reales.)
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
# Migraciones Alembic: archivos autogenerados, no se tipan.
module = ["app.persistence.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "session"
addopts = ["-n", "auto", "-m", "not postgres"]
# Los tests marcados `postgres` corren en un paso aparte y SECUENCIAL (-n 0):
# comparten una base real y el rollback por test no los aísla entre workers.
filterwarnings = [
    # httpx depreca `cookies=` por request; los tests lo usan a propósito para
    # mandar la sesión de un tenant u otro sin compartir el jar del cliente.
    "ignore:Setting per-request cookies:DeprecationWarning",
    # passlib importa `crypt` (removido en 3.13). Pin a 3.12 (ADR-0007).
    "ignore:'crypt' is deprecated:DeprecationWarning",
]
markers = [
    "postgres: requiere PostgreSQL real (docker); correr con -m postgres -n 0",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/tests/*",
    "app/persistence/migrations/*",
]

[tool.coverage.report]
# ADR-0008: este es el ÚNICO lugar donde vive el número. Ni el Makefile ni el
# workflow lo repiten — así fue como Véktor terminó con 60 en tres archivos.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
]
