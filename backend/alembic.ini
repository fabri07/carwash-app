[alembic]
script_location = app/persistence/migrations
prepend_sys_path = .
path_separator = os

# Override sqlalchemy.url with DATABASE_URL env var in migrations/env.py
sqlalchemy.url = postgresql+psycopg2://carwash:carwash@localhost:5432/carwash

[post_write_hooks]
# ADR-0007: las migraciones generadas salen formateadas
hooks = ruff_format
ruff_format.type = exec
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
